<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--text-primary)}body{padding:20px}.g{display:flex;gap:16px;flex-wrap:wrap}.sw{width:96px}.chip{height:56px;border-radius:6px}.n{font-size:11px;margin-top:6px;color:var(--text-secondary);font-family:var(--font-mono)}.v{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono)}</style><style>table{border-collapse:collapse;font-size:12px}td{padding:5px 18px 5px 0;font-family:var(--font-mono);color:var(--text-secondary)}td:first-child{color:var(--text-primary)}.d{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule-2)}</style></head><body>
<table><tr><td>--text-primary</td><td>--ink-1</td><td><div class="d" style="background:var(--text-primary)"></div></td><td>--surface-page</td><td>--paper</td><td><div class="d" style="background:var(--surface-page)"></div></td></tr>
<tr><td>--text-secondary</td><td>--ink-2</td><td><div class="d" style="background:var(--text-secondary)"></div></td><td>--surface-sunk</td><td>--paper-sunk</td><td><div class="d" style="background:var(--surface-sunk)"></div></td></tr>
<tr><td>--text-tertiary</td><td>--ink-3</td><td><div class="d" style="background:var(--text-tertiary)"></div></td><td>--divider</td><td>--rule-1</td><td><div class="d" style="background:var(--divider)"></div></td></tr>
<tr><td>--text-placeholder</td><td>--ink-4</td><td><div class="d" style="background:var(--text-placeholder)"></div></td><td>--border-input</td><td>--rule-2</td><td><div class="d" style="background:var(--border-input)"></div></td></tr></table>
</body></html>
