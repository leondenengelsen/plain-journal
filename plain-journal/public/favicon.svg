<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- pen barrel: a diagonal from top-right down to the nib -->
    <path d="M24 5 L11 18" />
    <!-- nib: a triangle pointing to the writing point -->
    <path d="M11 18 L7 25 L14 21 Z" />
    <!-- the point / ink mark -->
    <path d="M7 25 L5 27" />
    <!-- barrel top cap -->
    <path d="M22 3 L27 8" />
  </g>
</svg>
